---
- name: ensure database service is up
  service:
    name: postgresql
    state: started
  become: true

- name: get postgres version number
  shell:
    cmd: dpkg -l | awk '{print $2;}' | grep -P 'postgresql-\d\d' | sed 's/.*-//' | sort -V | tail -1
  register: postgres_version

- name: allow users to connect locally
  become: true
  lineinfile:
     dest: /etc/postgresql/{{ postgres_version.stdout }}/main/pg_hba.conf
     regexp: '^host\s+all\s+all\s+127.0.0.1/32'
     line: 'host    all             all             127.0.0.1/32            md5'
     backrefs: yes
  register: pg_hba_conf

- service:
    name: postgresql
    state: restarted
  become: true
  when: pg_hba_conf.changed

- name: Test for existing config
  ansible.builtin.stat:
    path: "{{ app_home }}/src/{{ app_name }}/prod_db.py"
  register: prod_db_stat

- debug: var=prod_db_stat

- name: if config exists, test if it can connect to db
  block:
    - name: Get current db url from prod_db.py
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "-c"
          - 'import prod_db; print(prod_db.sqlalchemy["url"])'
        chdir: "{{ app_home }}/src/{{ app_name }}"
      register: raw_db_url
      changed_when: false

    - name: check that db url still works
      ansible.builtin.command:
        cmd: |-
          "{{ app_home }}"/bin/python3 -c "
          import sys
          from sqlalchemy import create_engine
          from sqlalchemy.exc import OperationalError

          try:
              engine = create_engine('{{ raw_db_url.stdout_lines[0] }}')
              with engine.connect():
                  pass
          except OperationalError:
              sys.exit(1)
          "
      register: connect_result
      changed_when: false
      failed_when: false

    - set_fact:
        db_pw_good: "{{ connect_result.rc == 0 }}"

  when: prod_db_stat.stat.exists

- debug: var=db_pw_good

- name: set up new password, db, etc. if necessary
  block:
    - name: generate pseudo-random password for the database connection
      shell: python3 -c "import os, base64; print(base64.b64encode(os.urandom(30))[:${length}].decode())"
      register: db_password
      changed_when: false

    - name: Make {{ app_name }} user
      postgresql_user:
        name: "{{ app_name }}"
        password: "{{ db_password.stdout }}"
        role_attr_flags: SUPERUSER
        login_user: postgres
      become_user: postgres
      become: true

    - name: Make {{ app_name }} database
      postgresql_db:
        name: "{{ app_name }}"
        owner: "{{ app_name }}"
        state: present
        login_user: postgres
      become_user: postgres
      become: true

    - name: ensure database service is up
      service:
        name: postgresql
        state: started
      become: true

    - name: create the prod_db config file with the db password
      template:
        src: ../templates/prod_db.py.j2
        dest: "{{ app_home }}/src/{{ app_name }}/prod_db.py"
      notify:
        - restart app

    - name: write a .pgpass file so we can back up the db
      lineinfile:
        path: "/home/{{ ansible_ssh_user }}/.pgpass"
        owner: "{{ ansible_ssh_user }}"
        group: "{{ ansible_ssh_user }}"
        mode: 0600
        create: yes
        state: present
        line: '127.0.0.1:5432:{{ app_name }}:{{ app_name }}:{{ db_password.stdout }}'


    # this needs to be here because it needs the new db password
    - name: create the prod alembic.ini file
      template:
        src: ../templates/alembic-prod.ini.j2
        dest: "{{ app_home }}/src/{{ app_name }}/alembic-prod.ini"

    - name: check if database for app needs populating
      # this should be configurable/optional in the playbook
      ansible.builtin.command: psql -t chacra -c "SELECT COUNT(*) FROM projects;"
      become_user: postgres
      become: true
      register: database_is_populated
      ignore_errors: true
      changed_when: "database_is_populated.rc != 0"

    - name: populate the database for {{ app_name }}
      when: "database_is_populated.rc == 1"
      command: "{{ app_home }}/bin/pecan populate {{ app_home }}/src/{{ app_name }}/prod.py"
      environment:
        ALEMBIC_CONFIG: "{{ app_home }}/src/{{ app_name }}/alembic-prod.ini"

  when: not (db_pw_good | default(false) | bool)
